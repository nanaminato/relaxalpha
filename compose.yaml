services:
  relaxalpha:
    build: .
    ports:
      - "127.0.0.1:${RELAXALPHA_PORT:-8080}:8080"
    environment:
      Database__Provider: Sqlite
      ExchangeDaily__Enabled: "${RELAXALPHA_EXCHANGE_DAILY:-true}"
      ExchangeDaily__SeedDirectory: /exchange-seed
      CzceDaily__Enabled: "${RELAXALPHA_CZCE_DAILY:-true}"
      CzceDaily__SeedDirectory: /exchange-seed
      ConnectionStrings__Market: Data Source=/data/relaxalpha.db
    volumes:
      - sqlite:/data
      - ./.exchange-cache:/exchange-seed:ro

volumes:
  sqlite:
